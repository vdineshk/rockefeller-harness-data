name: Harness Daily Fetch
on:
  schedule:
    - cron: '30 17 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python fetch.py
      - run: |
          git config user.name "harness-bot"
          git config user.email "bot@harness.local"
          git add data/
          git diff --staged --quiet || git commit -m "feed: $(date -u +%Y-%m-%d)"
          git push
